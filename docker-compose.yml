version: "3.8"

services:
  core:
    build:
      context: ./packages/nanocoop-core
      dockerfile: Dockerfile
    container_name: nanocoop-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NANOCOOP_HOST=0.0.0.0
      - NANOCOOP_PORT=8000
      - NANOCOOP_DB_PATH=/data/nanocoop.db
      - NANOCOOP_DEBUG=false
    volumes:
      - nanocoop-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  sms-bridge:
    build:
      context: ./packages/nanocoop-sms-bridge
      dockerfile: Dockerfile
    container_name: nanocoop-sms-bridge
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      - CORE_API_URL=http://core:8000

  teller-web:
    build:
      context: .
      dockerfile: ./packages/nanocoop-teller/Dockerfile
    container_name: nanocoop-teller-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      core:
        condition: service_healthy

volumes:
  nanocoop-data:
    name: nanocoop-data
